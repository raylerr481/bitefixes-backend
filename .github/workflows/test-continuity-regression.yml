name: Test continuity regression

on:
  push:
    branches: [research-result-cme-multitenant]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  continuity-regression:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://unit-test.supabase.local
      SUPABASE_KEY: unit-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run continuity regression
        run: python -m pytest -q tests/test_continuity_regression_generic.py tests/test_conversation_state_generic.py tests/test_cme_continuity_multicompany.py tests/test_cme_research_multitenant.py tests/test_chat_cme_research_integration.py
