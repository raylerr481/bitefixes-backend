name: Test CME research multi-company

on:
  push:
    branches:
      - main
      - research-result-cme-multitenant
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cme-research-multitenant:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://unit-test.supabase.local"
      SUPABASE_KEY: "unit-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run CME and multi-company tests
        run: python -m pytest -q tests/test_cme_research_multitenant.py
