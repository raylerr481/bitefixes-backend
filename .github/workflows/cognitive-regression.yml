name: Cognitive regression

on:
  push:
    branches: [feat/cognitive-context-loop]
  pull_request:
    branches: [main]

jobs:
  cognitive-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_cognitive_context_bridge.py tests/test_evidence_guard.py tests/test_idempotency_guard.py -q
