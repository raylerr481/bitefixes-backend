name: Test contextual research

on:
  push:
    branches:
      - contextual-research-regression
  pull_request:
    branches:
      - main
    paths:
      - "app/ai/consultation_service.py"
      - "app/ai/web_intelligence.py"
      - "app/services/memory_service.py"
      - "app/ai/contextual_resolution.py"
      - "app/ai/contextual_message_resolver.py"
      - "tests/test_web_intelligence.py"
      - "tests/test_contextual_research.py"
      - "tests/test_investigative_context.py"
      - ".github/workflows/test-contextual-research.yml"

jobs:
  contextual-research:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://unit-test.supabase.local"
      SUPABASE_KEY: "unit-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run contextual research tests
        run: python -m pytest -q tests/test_web_intelligence.py tests/test_contextual_research.py tests/test_investigative_context.py
