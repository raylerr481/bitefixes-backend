name: Test company AI context packet

on:
  pull_request:
    paths:
      - "app/ai/ai_council.py"
      - "tests/test_company_ai_context_packet.py"
      - ".github/workflows/test-context-packet.yml"

jobs:
  context-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run focused context test
        run: python -m pytest -q tests/test_company_ai_context_packet.py
