name: Bitey AI tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/ai/**'
      - 'app/services/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ai-tests.yml'
  pull_request:
    paths:
      - 'app/ai/**'
      - 'app/services/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Run Bitey AI and regression tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_ai_runtime.py
          tests/test_ai_response_path.py
          tests/test_comparative_engine.py
          tests/test_experience_learning.py
          tests/test_knowledge_promotion.py
          tests/test_intent_subject_priority.py
