name: Bitey AI tests

on:
  push:
    paths:
      - 'app/ai/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ai-tests.yml'
  pull_request:
    paths:
      - 'app/ai/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: PYTHONPATH=. python -m pytest -q tests/test_ai_runtime.py tests/test_comparative_engine.py tests/test_experience_learning.py tests/test_knowledge_promotion.py
