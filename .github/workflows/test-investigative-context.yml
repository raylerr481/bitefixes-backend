name: Test investigative contextual flow

on:
  push:
    branches:
      - contextual-research-regression
  pull_request:
    branches:
      - main

jobs:
  investigative-context:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://unit-test.supabase.local"
      SUPABASE_KEY: "unit-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run investigative regression tests
        run: python -m pytest -q tests/test_investigative_context.py tests/test_web_intelligence.py tests/test_contextual_research.py
