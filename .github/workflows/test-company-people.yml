name: Test company people context

on:
  push:
    branches:
      - "feat/company-people-context"
  pull_request:
    paths:
      - "app/services/company_people_service.py"
      - "app/ai/ai_council.py"
      - "tests/test_company_people_service.py"
      - ".github/workflows/test-company-people.yml"

jobs:
  company-people:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_company_people_service.py
